<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Пиксельград — онлайн-город</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a1622">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=PT+Sans+Narrow:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1b2330;font-family:'PT Sans Narrow',sans-serif;font-size:15px;color:#f4ecd8;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100vw;height:100vh;image-rendering:pixelated;display:block;touch-action:none}
.box{background:rgba(26,22,34,.92);border:3px solid #0e0b14;box-shadow:inset 0 0 0 2px #4a3f5c,4px 4px 0 rgba(0,0,0,.35);padding:8px 10px}
h3{margin:0 0 8px;font-size:11px;line-height:1.5;color:#ffd166;font-family:'Press Start 2P',monospace;font-weight:400}
.mut{color:#a99fb8;font-size:13px}.up{color:#7bd389}.down{color:#ff6b6b}
.btn{display:inline-block;background:#3a7d44;color:#fff;border:2px solid #0e0b14;box-shadow:inset -2px -2px 0 rgba(0,0,0,.3),inset 2px 2px 0 rgba(255,255,255,.2);padding:4px 9px;cursor:pointer;font-family:inherit;font-size:14px;margin:2px 2px 2px 0;touch-action:manipulation}
.btn:hover{filter:brightness(1.18)}.btn.dis{background:#4a4a4a;color:#999;pointer-events:none}
.btn.red{background:#a63d40}.btn.blue{background:#3d6ea6}.btn.gold{background:#b8860b}.btn.on{background:#d98e04}.btn.sm{padding:2px 6px;font-size:13px}
input{font-family:inherit;font-size:16px;padding:7px;background:#120f18;color:#fff;border:2px solid #4a3f5c;width:100%;margin:4px 0;user-select:text;-webkit-user-select:text}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:2px;white-space:nowrap}
.row{border-top:2px solid #3a3148;padding:7px 0}
.bar{height:8px;background:#120f18;border:2px solid #0e0b14;margin-top:3px}.bar>i{display:block;height:100%;background:#ffd166;transition:width .2s}
#top{position:fixed;top:6px;left:6px;right:6px;display:flex;gap:6px;align-items:stretch;z-index:4;pointer-events:none;padding-top:env(safe-area-inset-top)}
#top>*{pointer-events:auto}
.logo{font-family:'Press Start 2P',monospace;font-size:12px;display:flex;align-items:center;color:#ffd166;text-shadow:2px 2px 0 #7a3b2e}
#money{font-size:19px;color:#ffd166;white-space:nowrap}#rank{font-size:13px;color:#9be7ff;white-space:nowrap}
#inv{display:flex;gap:4px;align-items:center;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.chip{background:#2b2438;border:2px solid #0e0b14;padding:1px 6px;font-size:14px;white-space:nowrap}
#topbtns{display:flex;gap:4px;align-items:center}
#sheet{position:fixed;right:6px;top:66px;bottom:6px;width:390px;display:flex;flex-direction:column;z-index:4;padding:0}
#tabs{display:flex;border-bottom:3px solid #0e0b14;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.tab{flex:1;text-align:center;padding:7px 4px;cursor:pointer;font-size:12px;white-space:nowrap;background:#221c2c;border-right:2px solid #0e0b14;touch-action:manipulation}
.tab.on{background:#3a3148;color:#ffd166}.tab .ic{font-size:17px;display:block}
#tabbody{flex:1;overflow:auto;padding:10px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#mmbox{position:fixed;left:6px;bottom:6px;padding:4px;z-index:4}
#mm{display:block;width:252px;height:204px;image-rendering:pixelated;touch-action:none}
#ticker{position:fixed;left:8px;bottom:224px;width:420px;font-size:13px;line-height:1.35;z-index:3;pointer-events:none;text-shadow:1px 1px 0 #000,0 0 3px #000}
#coach{position:fixed;left:calc(50% - 200px);transform:translateX(-50%);bottom:12px;width:min(560px,calc(100vw - 720px));min-width:380px;display:none;z-index:7;gap:10px;align-items:flex-start;border-color:#ffd166}
#coach .face{font-size:38px;line-height:1;background:#2b2438;border:3px solid #0e0b14;padding:4px}
#coach .txt{font-size:16px;line-height:1.35}
#coach .who{font-family:'Press Start 2P',monospace;font-size:9px;color:#ffd166;margin-bottom:5px}
.skip{font-size:13px;color:#a99fb8;cursor:pointer;text-decoration:underline;margin-left:8px}
.hl{animation:hl 1s infinite}
@keyframes hl{0%,100%{box-shadow:0 0 0 3px #ffd166}50%{box-shadow:0 0 0 8px rgba(255,209,102,.35)}}
#toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:20;display:none;max-width:90vw;text-align:center}
.float{position:fixed;pointer-events:none;font-weight:700;font-size:16px;text-shadow:2px 2px 0 #000;transform:translate(-50%,-50%);white-space:nowrap;z-index:2}
.wlab{position:fixed;pointer-events:none;transform:translate(-50%,-100%);white-space:nowrap;font-size:12px;text-shadow:1px 1px 0 #000,-1px -1px 0 #000;font-weight:700;z-index:1}
.wlab.big{font-family:'Press Start 2P',monospace;font-size:16px;opacity:.6;letter-spacing:3px;color:#fff;font-weight:400}
.wlab.me{background:#ffd166;color:#1a1622;text-shadow:none;padding:0 4px;border:2px solid #0e0b14}
.wlab.other{background:rgba(14,11,20,.75);padding:0 3px}
.bubble{position:fixed;transform:translate(-50%,-100%);background:#fff;color:#111;padding:3px 7px;border:2px solid #0e0b14;font-size:14px;max-width:220px;white-space:normal;z-index:3;pointer-events:none}
#tip{position:fixed;pointer-events:none;display:none;font-size:13px;z-index:5;max-width:260px}
#auth{position:fixed;inset:0;background:rgba(10,8,16,.6);display:none;align-items:center;justify-content:center;z-index:30;padding:10px}
#auth .box{width:min(440px,100%);padding:18px}
.atabs{display:flex;margin-bottom:8px}.atabs .tab{border:2px solid #0e0b14}
.sw{display:inline-block;width:32px;height:32px;border:3px solid #0e0b14;margin:3px;cursor:pointer}.sw.on{outline:3px solid #fff}
#roomui{position:fixed;left:6px;top:66px;z-index:5;display:none;flex-direction:column;align-items:flex-start;gap:6px;max-width:300px}
#hand{display:none}
#chat{position:fixed;left:6px;bottom:6px;z-index:5;display:none;width:min(420px,calc(100vw - 420px))}
#chat input{margin:0}
.inroom .wlab:not(.roomlab),.inroom .float,.inroom #ticker,.inroom #mmbox{display:none!important}
#err{position:fixed;bottom:0;right:0;background:#a00;color:#fff;font:12px monospace;white-space:pre;display:none;z-index:99;padding:6px;max-width:60vw}
.mobonly{display:none}
@media (max-width:820px){
  #top{flex-wrap:wrap;gap:4px}
  .logo{display:none}
  #top .box{padding:5px 7px}
  #inv{order:5;flex-basis:100%;padding:3px}
  #sheet{left:0;right:0;bottom:0;top:auto;width:auto;height:56vh;flex-direction:column-reverse;padding-bottom:env(safe-area-inset-bottom)}
  #sheet.collapsed{height:auto}#sheet.collapsed #tabbody{display:none}
  #tabs{border-bottom:0;border-top:3px solid #0e0b14}
  .tab{padding:6px 2px;font-size:11px}
  #mmbox{display:none;left:50%;transform:translateX(-50%);top:104px;bottom:auto}#mmbox.show{display:block}
  #mm{width:min(92vw,420px);height:auto;aspect-ratio:210/170}
  #ticker{display:none}
  #coach{left:6px;right:6px;transform:none;top:104px;bottom:auto;width:auto;min-width:0}
  #coach .face{font-size:26px}#coach .txt{font-size:15px}
  .btn{padding:7px 11px;font-size:15px}.btn.sm{padding:5px 8px;font-size:14px}
  .mobonly{display:inline-block}
  #roomui{top:104px;flex-direction:row;flex-wrap:wrap;max-width:none;right:6px}
  #chat{bottom:auto;top:150px;width:auto;right:6px}
  #tip{display:none!important}
}
</style>
<script>window.addEventListener('error',e=>{const b=document.getElementById('err');if(b){b.style.display='block';b.textContent+=e.message+' @'+(e.filename||'').split('/').pop()+':'+e.lineno+'\n';}});
window.addEventListener('unhandledrejection',e=>{const b=document.getElementById('err');if(b){b.style.display='block';b.textContent+=(e.reason&&e.reason.message||e.reason)+'\n';}});</script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div><div id="floats"></div>
<div id="top">
  <div class="box logo">ПИКСЕЛЬГРАД</div>
  <div class="box"><div id="money">💰 —</div><div id="rank">гость</div></div>
  <div class="box" id="inv"><span class="mut">склад пуст</span></div>
  <div class="box" id="topbtns"><span class="btn sm blue" data-act="home" title="Домой">🏠</span><span class="btn sm blue" data-act="findme" title="Где я">📍</span><span class="btn sm blue mobonly" data-act="map">🗺</span><span class="mut" id="online"></span></div>
</div>
<div class="box" id="sheet"><div id="tabs"></div><div id="tabbody"></div></div>
<div class="box" id="mmbox"><canvas id="mm" width="210" height="170"></canvas></div>
<div id="ticker"></div>
<div class="box" id="coach"><div class="face">👷</div><div style="flex:1"><div class="who" id="cwho"></div><div class="txt" id="ctxt"></div><div id="cbtn" style="margin-top:6px"></div></div></div>
<div class="box" id="toast"></div>
<div class="box" id="tip"></div>
<div id="roomui"><div class="box"><b id="roomTitle"></b></div><span class="btn red" data-act="leave">← В город</span><span id="hand"><span class="btn blue" data-act="rot">↻ Повернуть</span><span class="btn" data-act="drop">✖ В запас</span></span></div>
<div id="chat"><input id="chatin" maxlength="120" placeholder="Сообщение гостям… (Enter)"></div>
<div id="auth"><div class="box" id="authbox"></div></div>
<div id="err"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
