<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Пиксельград — онлайн-город</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png"><link rel="icon" href="favicon.ico"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a1622">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=PT+Sans+Narrow:wght@400;700&display=swap" rel="stylesheet">
<style>
html,body{touch-action:pan-x pan-y}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;height:100dvh;overflow:hidden;background:#1b2330;font-family:'PT Sans Narrow',sans-serif;font-size:15px;color:#f4ecd8;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#c{position:fixed;left:0;top:0;image-rendering:pixelated;display:block;touch-action:none}
.box{background:rgba(26,22,34,.92);border:3px solid #0e0b14;box-shadow:inset 0 0 0 2px #4a3f5c,4px 4px 0 rgba(0,0,0,.35);padding:8px 10px}
h3{margin:0 0 8px;font-size:11px;line-height:1.5;color:#ffd166;font-family:'Press Start 2P',monospace;font-weight:400}
.mut{color:#a99fb8;font-size:13px}.up{color:#7bd389}.down{color:#ff6b6b}
.btn{display:inline-block;background:#3a7d44;color:#fff;border:2px solid #0e0b14;box-shadow:inset -2px -2px 0 rgba(0,0,0,.3),inset 2px 2px 0 rgba(255,255,255,.2);padding:4px 9px;cursor:pointer;font-family:inherit;font-size:14px;margin:2px 2px 2px 0;touch-action:manipulation}
.btn:hover{filter:brightness(1.18)}.btn.dis{background:#4a4a4a;color:#999;pointer-events:none}
.btn.red{background:#a63d40}.btn.blue{background:#3d6ea6}.btn.gold{background:#b8860b}.btn.on{background:#d98e04}.btn.sm{padding:2px 6px;font-size:13px}
input{font-family:inherit;font-size:16px;padding:7px;background:#120f18;color:#fff;border:2px solid #4a3f5c;width:100%;margin:4px 0;user-select:text;-webkit-user-select:text}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:2px;white-space:nowrap}
.row{border-top:2px solid #3a3148;padding:7px 0}
.bar{height:8px;background:#120f18;border:2px solid #0e0b14;margin-top:3px}.bar>i{display:block;height:100%;background:#ffd166;transition:width .2s}
#top{position:fixed;top:6px;left:6px;right:6px;z-index:5;pointer-events:none;padding-top:env(safe-area-inset-top)}
#top>*{pointer-events:auto}
.chip{background:#2b2438;border:2px solid #0e0b14;padding:1px 6px;font-size:14px;white-space:nowrap}
.hud{display:flex;gap:6px;align-items:center;pointer-events:auto;flex-wrap:nowrap}
.pill{background:rgba(26,22,34,.92);border:2px solid #0e0b14;box-shadow:inset 0 0 0 1px #4a3f5c,2px 2px 0 rgba(0,0,0,.35);padding:4px 11px;border-radius:16px;font-size:17px;color:#ffd166;white-space:nowrap;cursor:pointer}
.pill.sm{font-size:13px;color:#cfc6dd;padding:4px 9px;cursor:default}.pill.logo{font-family:'Press Start 2P',monospace;font-size:10px;color:#ffd166}
#hgems,#hen{color:#9be7ff}#hen.low{color:#ff8a8a;animation:hl 1s infinite}
.lvlb{position:relative;width:42px;height:42px;cursor:pointer;flex:none}.lvlb svg{position:absolute;inset:0;transform:rotate(-90deg)}
.lvlb .ring-bg{fill:#1a1622;stroke:#3a3148;stroke-width:4}.lvlb .ring{fill:none;stroke:#ffd166;stroke-width:4;stroke-linecap:round}
#hlvl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Press Start 2P',monospace;font-size:12px;color:#fff}
#fabs{position:fixed;left:270px;bottom:14px;display:flex;flex-direction:row;gap:8px;z-index:4}
.fab{width:46px;height:46px;border-radius:50%;background:rgba(26,22,34,.94);border:2px solid #0e0b14;box-shadow:inset 0 0 0 2px #4a3f5c,2px 3px 0 rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-size:21px;cursor:pointer;position:relative;touch-action:manipulation}
.fab b{position:absolute;top:-5px;right:-5px;background:#c0392b;color:#fff;font-size:11px;border-radius:9px;padding:0 5px;font-family:inherit;line-height:17px}.fab b:empty{display:none}
.deskonly{}
#sheet{position:fixed;right:6px;top:66px;bottom:6px;width:390px;display:flex;flex-direction:column;z-index:4;padding:0}
#tabs{display:flex;border-bottom:3px solid #0e0b14;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.tab{flex:1;text-align:center;padding:7px 4px;cursor:pointer;font-size:12px;white-space:nowrap;background:#221c2c;border-right:2px solid #0e0b14;touch-action:manipulation}
.tab.on{background:#3a3148;color:#ffd166}.tab .ic{font-size:17px;display:block}
#tabbody{flex:1;overflow:auto;padding:10px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#mmbox{position:fixed;left:6px;bottom:6px;padding:4px;z-index:4}
#mm{display:block;width:250px;height:200px;image-rendering:pixelated;touch-action:none}
#ticker{position:fixed;left:8px;bottom:224px;width:420px;font-size:13px;line-height:1.35;z-index:3;pointer-events:none;text-shadow:1px 1px 0 #000,0 0 3px #000}
#coach{position:fixed;left:calc(50% - 200px);transform:translateX(-50%);bottom:12px;width:min(560px,calc(100vw - 720px));min-width:380px;display:none;z-index:7;gap:10px;align-items:flex-start;border-color:#ffd166}
#coach .face{font-size:38px;line-height:1;background:#2b2438;border:3px solid #0e0b14;padding:4px}
#coach .txt{font-size:16px;line-height:1.35}
#coach .who{font-family:'Press Start 2P',monospace;font-size:9px;color:#ffd166;margin-bottom:5px}
.skip{font-size:13px;color:#a99fb8;cursor:pointer;text-decoration:underline;margin-left:8px}
.hl{animation:hl 1s infinite}
@keyframes hl{0%,100%{box-shadow:0 0 0 3px #ffd166}50%{box-shadow:0 0 0 8px rgba(255,209,102,.35)}}
#gwfab{animation:gwp 1.6s ease-in-out infinite}@keyframes gwp{50%{transform:scale(1.15);filter:drop-shadow(0 0 6px #ffd166)}}
#toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:20;display:none;max-width:90vw;text-align:center}
.float{position:fixed;pointer-events:none;font-weight:700;font-size:16px;text-shadow:2px 2px 0 #000;transform:translate(-50%,-50%);white-space:nowrap;z-index:2}
.wlab{position:fixed;pointer-events:none;transform:translate(-50%,-100%);white-space:nowrap;font-size:12px;text-shadow:1px 1px 0 #000,-1px -1px 0 #000;font-weight:700;z-index:1}
.wlab.big{font-family:'Press Start 2P',monospace;font-size:16px;opacity:.6;letter-spacing:3px;color:#fff;font-weight:400}
.wlab.me{background:#ffd166;color:#1a1622;text-shadow:none;padding:0 4px;border:2px solid #0e0b14}
.wlab.poi{background:rgba(20,40,20,.7);padding:0 4px;border:1px solid #2e7d32}
.wlab.other{background:rgba(14,11,20,.75);padding:0 3px}
.wbub{margin-top:-16px;border-radius:8px;font-size:13px;max-width:180px;text-align:center;line-height:1.25}
.bubble{position:fixed;transform:translate(-50%,-100%);background:#fff;color:#111;padding:3px 7px;border:2px solid #0e0b14;font-size:14px;max-width:220px;white-space:normal;z-index:3;pointer-events:none}
#tip{position:fixed;pointer-events:none;display:none;font-size:13px;z-index:5;max-width:260px}
#auth{position:fixed;inset:0;background:rgba(10,8,16,.6);display:none;align-items:center;justify-content:center;z-index:30;padding:10px}
#auth .box{width:min(440px,100%);padding:18px}
.atabs{display:flex;margin-bottom:8px}.atabs .tab{border:2px solid #0e0b14}
.sw{display:inline-block;width:32px;height:32px;border:3px solid #0e0b14;margin:3px;cursor:pointer}.sw.on{outline:3px solid #fff}
#roomui{position:fixed;left:6px;top:66px;z-index:5;display:none;flex-direction:column;align-items:flex-start;gap:6px;max-width:300px}
#hand{display:none}
#inapp{position:fixed;inset:0;z-index:100;background:rgba(8,6,14,.86);display:flex;align-items:center;justify-content:center;padding:20px;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
#inapp .ia-box{background:#1c1826;border-radius:22px;padding:24px 22px 18px;max-width:340px;width:100%;color:#fff;display:flex;flex-direction:column;gap:14px;box-shadow:0 12px 40px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,209,102,.5)}
#inapp .ia-logo{font:16px 'Press Start 2P',monospace;color:#ffd166;text-align:center;text-shadow:3px 3px 0 #c0392b;letter-spacing:1px}
#inapp .ia-t{font-size:21px;font-weight:700;text-align:center;letter-spacing:-.2px}
#inapp .ia-row{display:flex;gap:12px;align-items:center;background:#2a2436;border-radius:14px;padding:12px 14px;font-size:16px;font-weight:500;line-height:1.35}
#inapp .ia-row b{color:#ffd166;font-weight:700}
#inapp .ia-n{flex:0 0 28px;height:28px;border-radius:50%;background:#ffd166;color:#1c1826;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px}
#inapp .ia-dots{display:inline-flex;align-items:center;justify-content:center;background:#fff;color:#111;border-radius:99px;padding:1px 9px;font-weight:900;font-size:12px;letter-spacing:1px;vertical-align:1px}
#inapp .ia-stay{color:#8e86a0;font-size:14px;text-align:center;cursor:pointer;padding-top:2px}
#inapp .ia-arrow{position:fixed;top:10px;right:18px;width:46px;height:46px;border-top:7px solid #ffd166;border-right:7px solid #ffd166;border-radius:4px;animation:iaj 1s ease-in-out infinite;filter:drop-shadow(0 3px 0 #0e0b14)}
#inapp .ia-arrow::after{content:'';position:absolute;top:-4px;right:-4px;width:64px;height:7px;background:#ffd166;border-radius:4px;transform-origin:right center;transform:rotate(-45deg)}
@keyframes iaj{50%{transform:translate(5px,-7px)}}
#clubhud{display:none;background:linear-gradient(135deg,rgba(46,34,70,.82),rgba(20,15,30,.72));-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,209,102,.45);border-radius:14px;padding:8px 12px;color:#fff;min-width:230px;box-shadow:0 6px 24px rgba(0,0,0,.45)}
body.inclub #clubhud{display:block}body.inclub #roomtitlebox{display:none}body.inclub #sheet{display:none!important}
.ch-top{display:flex;gap:8px;align-items:center;font-size:15px}.ch-top b{flex:1}#chppl{font-size:13px;opacity:.85}
.ch-en{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:13px}.ch-bar{flex:1;height:8px;background:rgba(255,255,255,.12);border-radius:6px;overflow:hidden}
.ch-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd166,#ff9f1c);border-radius:6px;box-shadow:0 0 8px #ffd166;transition:width .6s}
.ch-x3{background:#ffd166;color:#1a1622;border-radius:8px;padding:1px 6px;font-weight:bold;font-size:12px;animation:chp 1.6s infinite}@keyframes chp{50%{transform:scale(1.15)}}
#chat{position:fixed;left:6px;bottom:6px;z-index:5;display:none;width:min(420px,calc(100vw - 420px))}
#chat input{margin:0}
#cchat{position:fixed;left:270px;bottom:70px;width:360px;z-index:6;display:none;font-size:13px}
body.chaton #cchat{display:block}
#cclist{background:rgba(14,11,20,.38);padding:4px 7px;cursor:pointer;text-shadow:0 1px 2px #000;border-radius:3px}
#cclist .cl{opacity:.85;line-height:1.3;word-break:break-word}
#cchead,#ccrow{display:none}
#cchat.open{background:#1a1622f2;border:3px solid #0e0b14;padding:6px}
#cchat.open #cchead{display:flex;justify-content:space-between;align-items:center;color:#ffd166;margin-bottom:4px}#ccx{cursor:pointer;padding:0 8px;font-size:20px;color:#fff}
#cchat.open #cclist{max-height:40vh;overflow:auto;background:none;cursor:default}#cchat.open .cl{opacity:1}
#cchat.open #ccrow{display:flex;gap:6px;margin-top:6px}#ccin{flex:1;margin:0;min-width:0}
.inroom .wlab:not(.roomlab),.inroom .float,.inroom #ticker,.inroom #mmbox{display:none!important}
.creator{display:flex;gap:12px;align-items:flex-start}
.cprev{flex:0 0 250px}
#lookcv{width:240px;height:300px;display:block;margin:0 auto;image-rendering:pixelated;background:radial-gradient(circle at 50% 60%,#4a3f5c,#1a1622 70%);border:3px solid #0e0b14;touch-action:none;cursor:grab}
.copts{flex:1;min-width:0}.ctabs{display:flex;flex-wrap:wrap;gap:2px;margin-bottom:6px}
#copt{max-height:340px;overflow:auto}.crow{margin:6px 0}.swrow{display:flex;flex-wrap:wrap}.swrow .sw{width:28px;height:28px}
body.onisland #topbtns,body.onisland #online,body.onisland #mmbox,body.onisland #ticker{display:none!important}
.mitem{display:flex;align-items:center;gap:10px;padding:10px 6px;border-top:2px solid #3a3148;cursor:pointer}.mitem:hover{background:#2b2438}
.mic{font-size:24px;width:34px;text-align:center}.mitem>span:nth-child(2){flex:1}.mgo{font-size:24px;color:#a99fb8}
#hprof{margin-left:auto;color:#fff}body.onisland #hprof{display:none}
#err{position:fixed;bottom:0;right:0;background:#a00;color:#fff;font:12px monospace;white-space:pre;display:none;z-index:99;padding:6px;max-width:60vw}
.mobonly{display:none}
@media (max-width:820px){
  #sheet{left:0;right:0;bottom:0;top:auto;width:auto;height:auto;max-height:44vh;flex-direction:column-reverse;padding-bottom:env(safe-area-inset-bottom)}
  #tabbody{max-height:calc(44vh - 80px)}
  #sheetbar{display:block!important;text-align:center;font-size:13px;color:#a99fb8;padding:3px;border-bottom:2px solid #0e0b14;cursor:pointer}
  #sheet.collapsed #sheetbar{display:none!important}
  #coach.mini .txt,#coach.mini #cbtn{display:none}#coach.mini{padding:4px 8px}#coach.mini .face{font-size:20px}
  #coach .txt{font-size:14px!important}
  #sheet.collapsed{height:auto}#sheet.collapsed #tabbody{display:none}
  #tabs{border-bottom:0;border-top:3px solid #0e0b14}
  .tab{padding:6px 2px;font-size:11px}
  #mmbox{display:none;left:50%;transform:translateX(-50%);top:104px;bottom:auto}#mmbox.show{display:block}
  #mm{width:min(92vw,420px);height:auto;aspect-ratio:400/320}
  #ticker{display:none}
  #coach{left:6px;right:6px;transform:none;top:104px;bottom:auto;width:auto;min-width:0}
  #coach .face{font-size:26px}#coach .txt{font-size:15px}
  .btn{padding:7px 11px;font-size:15px}.btn.sm{padding:5px 8px;font-size:14px}
  .mobonly{display:inline-block}
  #roomui{top:104px;flex-direction:row;flex-wrap:wrap;max-width:none;right:6px}
  #chat{bottom:auto;top:150px;width:auto;right:6px}
  .deskonly{display:none!important}
  .pill{font-size:15px;padding:3px 9px}.pill.sm{font-size:12px;padding:3px 7px}.lvlb{width:38px;height:38px}
  #fabs{left:auto;right:8px;bottom:calc(70px + env(safe-area-inset-bottom));flex-direction:column}
  body.sheetopen #fabs{display:none}
  #sheet{max-height:52vh}#tabbody{max-height:calc(52vh - 70px)}
  #coach{top:54px!important;padding:6px 8px;gap:8px}#coach .face{font-size:22px;padding:2px}#coach .who{font-size:8px;margin-bottom:3px}
  #coach .txt{max-height:24vh;overflow:auto}
  #coach.withsheet .txt{max-height:14vh;font-size:13px!important}#coach.withsheet{opacity:.97}
  #toast{top:56px}
  #cchat{left:6px;right:calc(8px + clamp(38px,11vw,48px) + 8px);width:auto;bottom:calc(74px + env(safe-area-inset-bottom));font-size:12px}
  #cchat.open{top:54px;bottom:auto;right:6px;font-size:14px}
  body.sheetopen #cchat:not(.open){display:none!important}
  .pill{font-size:clamp(12px,3.9vw,16px);padding:3px clamp(6px,2.2vw,10px)}.pill.sm{font-size:clamp(10px,3.1vw,13px)}
  .lvlb{width:clamp(32px,9.5vw,40px);height:clamp(32px,9.5vw,40px)}#hlvl{font-size:clamp(9px,2.8vw,12px)}
  .fab{width:clamp(38px,11vw,48px);height:clamp(38px,11vw,48px);font-size:clamp(17px,5vw,22px)}
  .tab{font-size:clamp(10px,2.9vw,12px)}.tab .ic{font-size:clamp(16px,5vw,20px)}
  .btn{font-size:clamp(13px,3.8vw,15px)}#tabbody{font-size:clamp(13px,3.8vw,15px)}
  #sheet{max-height:52dvh}#tabbody{max-height:calc(52dvh - 70px)}
  #tip{display:none!important}
  .creator{flex-direction:column;align-items:stretch}.cprev{flex:none}#lookcv{width:170px;height:212px}#copt{max-height:34vh}
  #auth .box{max-height:94vh;overflow:auto;padding:12px}
}
</style>
<script>window.addEventListener('error',e=>{const b=document.getElementById('err');if(b){b.style.display='block';b.textContent+=e.message+' @'+(e.filename||'').split('/').pop()+':'+e.lineno+'\n';}});
window.addEventListener('unhandledrejection',e=>{const b=document.getElementById('err');if(b){b.style.display='block';b.textContent+=(e.reason&&e.reason.message||e.reason)+'\n';}});</script>

<body>
<canvas id="c"></canvas>
<div id="labels"></div><div id="floats"></div>
<div id="top"><div class="hud">
  <div class="lvlb" data-act="levels" id="rank" title="Профиль"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" class="ring-bg"/><circle id="hxp" cx="20" cy="20" r="16" class="ring" stroke-dasharray="0 101"/></svg><span id="hlvl">1</span></div>
  <div class="pill" id="money">💰 —</div><div class="pill" id="hgems" data-act="gems">💎 0</div><div class="pill" id="hen" data-act="energy">⚡ —</div>
  <div class="pill sm" id="htime"></div><div class="pill sm deskonly" id="online"></div><div class="pill" id="hprof" data-act="profile" title="Профиль">👤</div><div class="pill sm deskonly logo">ПИКСЕЛЬГРАД</div>
</div></div>
<div id="fabs"><span class="fab" data-act="findme" title="К себе">📍</span><span class="fab" data-act="home" id="topbtns" title="Домой">🏠</span><span class="fab" data-act="gw" id="gwfab" title="Розыгрыш" style="display:none">🎁</span><span class="fab" data-act="inv" id="inv" title="Склад">📦<b id="invn"></b></span></div>
<div class="box" id="sheet"><div id="tabs"></div><div id="sheetbar" class="mobonly" data-act="closesheet">▾ свернуть</div><div id="tabbody"></div></div>
<div class="box" id="mmbox"><canvas id="mm" width="280" height="220"></canvas></div>
<div id="ticker"></div>
<div class="box" id="coach"><div class="face" data-act="coachmin">👷</div><div style="flex:1"><div class="who" id="cwho"></div><div class="txt" id="ctxt"></div><div id="cbtn" style="margin-top:6px"></div></div></div>
<div class="box" id="toast"></div>
<div class="box" id="tip"></div>
<div id="roomui"><div class="box" id="roomtitlebox"><b id="roomTitle"></b></div><div id="clubhud"><div class="ch-top"><span id="chic">🎭</span><b id="chn"></b><span id="chppl"></span></div><div class="ch-en"><span>⚡</span><div class="ch-bar"><i id="chbar"></i></div><b id="chval"></b><span class="ch-x3">×3</span></div></div><span class="btn red" data-act="leave">← В город</span><span class="btn blue" data-act="redit" id="reditbtn">🛠 Ремонт</span><span id="hand"><span class="btn blue" data-act="rot">↻ Повернуть</span><span class="btn" data-act="drop">✖ В запас</span></span></div>
<div id="cchat"><div id="cchead"><span>💬 Чат города</span><span id="ccx">✕</span></div><div id="cclist"></div><div id="ccrow"><input id="ccin" maxlength="140" placeholder="Сообщение…" autocomplete="off"><span class="btn sm gold" id="ccsend">➤</span></div></div>
<div id="chat"><input id="chatin" maxlength="120" placeholder="Сообщение…"></div>
<div id="auth"><div class="box" id="authbox"></div></div>
<div id="err"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
